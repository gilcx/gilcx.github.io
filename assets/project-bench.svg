<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#831843"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="400" fill="#120a12"/>
  <rect width="640" height="400" fill="url(#g)" opacity="0.34"/>
  <rect width="640" height="400" fill="url(#glow)"/>
  <!-- bar chart: benchmark results -->
  <g transform="translate(110 80)">
    <g fill="#fb7185" fill-opacity="0.85">
      <rect x="0"   y="70"  width="52" height="120" rx="4"/>
      <rect x="82"  y="30"  width="52" height="160" rx="4" fill="#fda4af"/>
      <rect x="164" y="90"  width="52" height="100" rx="4"/>
      <rect x="246" y="50"  width="52" height="140" rx="4" fill="#fda4af"/>
      <rect x="328" y="10"  width="52" height="180" rx="4" fill="#fecdd3"/>
    </g>
    <line x1="-10" y1="190" x2="392" y2="190" stroke="#fda4af" stroke-opacity="0.6"/>
    <g font-family="monospace" font-size="11" fill="#fda4af" fill-opacity="0.8">
      <text x="8"  y="212">TP1</text>
      <text x="90" y="212">TP2</text>
      <text x="172" y="212">TP4</text>
      <text x="254" y="212">PP2</text>
      <text x="336" y="212">DP4</text>
    </g>
    <text x="0" y="-12" font-family="monospace" font-size="12" fill="#fecdd3" fill-opacity="0.85">throughput (tok/s) &#8212; parallelism sweep</text>
  </g>
  <text x="48" y="330" font-family="monospace" font-size="15" fill="#fda4af" letter-spacing="4">PERFORMANCE / PYTHON / DOCKER / NVIDIA</text>
  <text x="48" y="372" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#fff1f2">CDI Benchmark Suite</text>
</svg>
